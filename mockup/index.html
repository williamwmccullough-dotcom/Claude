/* Layout: sticky brand bar + role switcher, then one working column (list → deal detail), modals for forms. */
:root {

  --warn: #9a6200; --warn-soft: #fbefd6;
  --bad: #b3322b; --bad-soft: #fbe3e1;
  --info: #3b5a8c; --info-soft: #e5ebf5;
  --display: "Newsreader", Georgia, "Times New Roman", serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f131a; --surface: #171c25; --surface-2: #1f2531; --fg: #e8ebf1; --muted: #9aa3b4; --line: #2c3441;
  --navy: #0b1b31; --navy-fg: #eef2f8; --accent: #7fb0ee; --accent-soft: #1d2c44;
  --ok: #6fcf98; --ok-soft: #173326; --warn: #e8b45a; --warn-soft: #3a2c12; --bad: #f08a83; --bad-soft: #3d1c1a; --info: #9db7e0; --info-soft: #1e2a3e;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f131a; --surface: #171c25; --surface-2: #1f2531; --fg: #e8ebf1; --muted: #9aa3b4; --line: #2c3441;
  --navy: #0b1b31; --navy-fg: #eef2f8; --accent: #7fb0ee; --accent-soft: #1d2c44;
  --ok: #6fcf98; --ok-soft: #173326; --warn: #e8b45a; --warn-soft: #3a2c12; --bad: #f08a83; --bad-soft: #3d1c1a; --info: #9db7e0; --info-soft: #1e2a3e;

* { box-sizing: border-box; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--navy); }

.small { font-size: 0.85rem; }

/* Header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--navy); color: var(--navy-fg); }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px 8px; flex-wrap: wrap; }
.brand-name { font-family: var(--display); font-size: 1.3rem; font-weight: 600; letter-spacing: 0.01em; }

.roles { display: flex; gap: 4px; overflow-x: auto; padding-block: 0 10px; scrollbar-width: none; }
.roles button { background: transparent; border: 1px solid rgba(255,255,255,0.22); color: var(--navy-fg); border-radius: 999px; padding: 6px 12px; cursor: pointer; white-space: nowrap; font-size: 0.82rem; }
.roles button[aria-pressed="true"] { background: var(--navy-fg); color: var(--navy); border-color: var(--navy-fg); font-weight: 600; }

.stack { display: flex; flex-direction: column; gap: 20px; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 14px; cursor: pointer; font-weight: 500; font-size: 0.88rem; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 4px 10px; font-size: 0.8rem; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.panel-h { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.t-ok { background: var(--ok-soft); color: var(--ok); }
.t-warn { background: var(--warn-soft); color: var(--warn); }
.t-bad { background: var(--bad-soft); color: var(--bad); }

.tag { font-size: 0.72rem; font-weight: 600; padding: 2px 8px; border-radius: 4px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }

.attn { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }

.attn .cell.hot { border-color: var(--bad); }
.attn .cell.hot .big { color: var(--bad); }

/* Deal list */
.deals { display: flex; flex-direction: column; }
.deal-row { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1.4fr) minmax(120px, 1fr) auto; gap: 16px; align-items: center; padding: 14px 18px; border-top: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; }
.deal-row:first-child { border-top: 0; }
.deal-row:hover { background: var(--surface-2); }
.addr { font-weight: 600; }
.bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.bar.done > span { background: var(--ok); }
@media (max-width: 720px) {
  .deal-row { grid-template-columns: 1fr; gap: 8px; }
}

/* Deal detail */
.back { margin-bottom: 4px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px 24px; }
.facts div { min-width: 0; }
.facts .v { font-weight: 500; overflow-wrap: anywhere; }
.path { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.78rem; background: var(--surface-2); padding: 6px 10px; border-radius: 4px; overflow-x: auto; white-space: nowrap; }
.items { display: flex; flex-direction: column; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; padding: 12px 18px; border-top: 1px solid var(--line); align-items: start; }
.item:first-child { border-top: 0; }
.item .name { font-weight: 600; }
.item .hint { color: var(--muted); font-size: 0.83rem; }
.item .file { font-size: 0.8rem; color: var(--muted); margin-top: 4px; overflow-wrap: anywhere; }
.item .note { margin-top: 6px; font-size: 0.83rem; background: var(--bad-soft); color: var(--bad); padding: 6px 10px; border-radius: 4px; }
.item .note.info { background: var(--info-soft); color: var(--info); }
.item .acts { display: flex; gap: 6px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.item.na { opacity: 0.6; }
@media (max-width: 560px) { .item { grid-template-columns: 1fr; } .item .acts { justify-content: flex-start; } }
.two { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .two { grid-template-columns: 1fr; } }
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; font-size: 0.83rem; }
.log li { display: grid; grid-template-columns: 70px 1fr; gap: 8px; }
.steps { display: flex; flex-direction: column; gap: 0; list-style: none; padding: 0; margin: 0; }
.steps li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding-block: 6px; font-size: 0.86rem; }
.steps .dot { width: 14px; height: 14px; margin-top: 3px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); }
.steps li.done .dot { background: var(--ok); border-color: var(--ok); }
.steps li.now .dot { border-color: var(--accent); background: var(--accent-soft); }
.steps li.now { font-weight: 600; }
.checks { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
.checks label { display: flex; gap: 8px; align-items: center; font-size: 0.88rem; }

/* Tables */
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
th { text-align: left; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--surface-2); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; cursor: pointer; color: var(--muted); font-weight: 500; white-space: nowrap; }

.count { display: inline-block; min-width: 20px; padding: 0 6px; border-radius: 999px; background: var(--surface-2); font-size: 0.75rem; text-align: center; margin-left: 4px; }

.modal { background: var(--surface); border-radius: 10px; width: 100%; max-width: 640px; border: 1px solid var(--line); }
.modal.wide { max-width: 820px; }

.modal-b { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }

.x { background: none; border: 0; font-size: 1.4rem; line-height: 1; cursor: pointer; color: var(--muted); }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
.fgrid .full { grid-column: 1 / -1; }
@media (max-width: 560px) { .fgrid { grid-template-columns: 1fr; } }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 0.8rem; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 8px 10px; width: 100%; }
.field textarea { min-height: 72px; resize: vertical; }
.field .pre { font-size: 0.72rem; color: var(--accent); font-weight: 600; }
.types { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.types label { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.types input { position: absolute; opacity: 0; pointer-events: none; }
.types label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.types label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.types label.off { opacity: 0.55; cursor: not-allowed; }
.types b { font-size: 0.9rem; }
.types span { font-size: 0.76rem; color: var(--muted); }
.fills { display: flex; flex-wrap: wrap; gap: 6px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 30; font-size: 0.88rem; max-width: calc(100% - 32px); }

</style>

let S;
const KEY = "assir-deal-desk-mockup-v1";
try { S = JSON.parse(localStorage.getItem(KEY)) || seed(); } catch (e) { S = seed(); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

// ---------- Helpers ----------
const $ = s => document.querySelector(s);
const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = n => n == null || n === "" || isNaN(n) ? "—" : Number(n).toLocaleString("en-US", { style: "currency", currency: "USD", minimumFractionDigits: Number(n) % 1 ? 2 : 0, maximumFractionDigits: 2 });
const fmtDate = s => { if (!s) return "—"; const d = new Date(s + "T12:00:00"); return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }); };
const short = s => { const d = new Date(s + "T12:00:00"); return d.toLocaleDateString("en-US", { month: "short", day: "numeric" }); };
const todayShort = short(TODAY);
const deal = id => S.deals.find(d => d.id === +id);
const agentName = d => PEOPLE[d.agent].name;
const actor = () => ({ agent: "Jamie", assistant: "Casey", tc: "Petrina", frontdesk: "Alex (front desk)", accounting: "Accounting", leadership: "Will" }[S.role]);

function defsFor(d) {
  const base = d.type === "listing" ? LISTING_ITEMS : TX_ITEMS;
  return base.concat(d.extra || []);
}
function itemsOf(d) {
  return defsFor(d).map(def => {
    if (def.cond && !def.cond(d)) return { def: def, s: { status: "auto-na" } };
    return { def: def, s: d.items[def.key] || { status: "missing" } };
  });
}
function progress(d) {
  const list = itemsOf(d).filter(x => x.s.status !== "auto-na");
  const done = list.filter(x => x.s.status === "approved" || x.s.status === "na").length;
  return { done: done, total: list.length, complete: done === list.length };
}
function counts(d) {
  const c = { missing: 0, rejected: 0, submitted: 0, nareq: 0 };
  itemsOf(d).forEach(x => {
    if (x.s.status === "missing") c.missing++;
    if (x.s.status === "rejected") c.rejected++;
    if (x.s.status === "submitted") c.submitted++;
    if (x.s.status === "na-req") c.nareq++;
  });
  return c;
}
function stage(d) {
  const p = progress(d);
  if (d.type === "listing") {
    if (!d.dash) return ["New: front desk entering in dash", "info"];
    if (!p.complete) return [d.extra.length ? "Listing change in progress" : "Gathering documents", "warn"];
    const allTasks = OFFICE_TASKS.every((_, i) => d.tasks && d.tasks[i]);
    return allTasks ? ["Active on MLS", "ok"] : ["Ready for MLS", "ok"];
  }
  if (!d.dash) return ["New: front desk entering in dash", "info"];
  if (!p.complete) return ["Under contract", "warn"];
  if (!d.advice) return ["File complete: waiting on title advice", "info"];
  const c = d.crf;
  if (!c || c.status === "draft") return ["CRF needed from agent", "bad"];
  if (c.status === "returned") return ["CRF returned to agent", "bad"];
  if (c.status === "submitted") return ["CRF with TC", "info"];
  if (c.status === "tc") return ["CRF with accounting", "info"];
  if (c.status === "acct") return ["Approved: wire pending", "ok"];
  return ["Paid", "ok"];
}
const pill = (text, tone) => `<span class="pill t-${tone}">${esc(text)}</span>`;
const ST_PILL = {
  missing: ["Missing", "muted"], submitted: ["Waiting on TC", "info"], approved: ["Approved", "ok"], rejected: ["Needs fixing", "bad"],
  "na-req": ["N/A requested", "warn"], na: ["Not applicable", "muted"], "auto-na": ["Not required", "muted"]
};
function folder(d) {
  const side = d.type === "listing" ? "Listing" : d.type === "seller" ? "Seller Side" : "Buyer Side";
  return `ASSIR Transactions / ${d.opened.slice(0, 4)} / ${d.address}, ${d.city} / ${side}`;
}
function crfCalc(c) {
  const gross = +c.gross || 0;
  const lessRef = gross - (+c.assirRef || 0) - (+c.outRef || 0);
  const admin = Math.round(lessRef * 0.05 * 100) / 100;
  const afterAdmin = lessRef - admin;
  const net = Math.round(afterAdmin * (+c.split || 0) * 100) / 100;
  return { gross: gross, lessRef: lessRef, admin: admin, afterAdmin: afterAdmin, net: net, assir: Math.round((afterAdmin - net) * 100) / 100 };
}
function addLog(d, text) { d.log = d.log || []; d.log.push([todayShort, text]); }
function toast(msg) {
  document.querySelectorAll(".toast").forEach(x => x.remove());
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}
function view() { return S.views[S.role] || { name: "home" }; }
function go(v) { S.views[S.role] = v; save(); render(); window.scrollTo(0, 0); }

// Which deals does each role see?
function visibleDeals() {
  if (S.role === "agent") return S.deals.filter(d => d.agent === "jamie");
  if (S.role === "assistant") return S.deals.filter(d => (S.team[d.agent] || []).includes("Casey Lin"));
  if (S.role === "tc") return S.deals.filter(d => PEOPLE[d.agent].tc === "petrina");
  if (S.role === "accounting") return S.deals.filter(d => d.type !== "listing" && progress(d).complete);
  return S.deals;
}

// ---------- Render ----------
function render() {
  $("#roles").innerHTML = ROLES.map(r => `<button data-act="role" data-role="${r.id}" aria-pressed="${S.role === r.id}">${esc(r.label)}</button>`).join("");
  $("#whoami").textContent = "Signed in as " + ROLES.find(r => r.id === S.role).who;
  const v = view();
  let html;
  if (v.name === "deal" && deal(v.id) && visibleDeals().includes(deal(v.id))) html = renderDeal(deal(v.id));
  else if (S.role === "agent" || S.role === "assistant") html = renderAgentHome();
  else if (S.role === "tc") html = renderTcHome();
  else if (S.role === "frontdesk") html = renderFrontHome();
  else if (S.role === "accounting") html = renderAcctHome();
  else html = renderLeaderHome();
  $("#app").innerHTML = html;
}

function dealRows(list, opts) {
  opts = opts || {};
  if (!list.length) return `<div class="empty">${esc(opts.empty || "No deals here.")}</div>`;
  return `<div class="deals">` + list.map(d => {
    const p = progress(d), [s, tone] = stage(d), c = counts(d);
    const flags = [];
    if (c.rejected) flags.push(`<span class="small" style="color:var(--bad)">${c.rejected} to fix</span>`);
    if (c.missing) flags.push(`<span class="small muted">${c.missing} missing</span>`);
    if (c.submitted && opts.tc) flags.push(`<span class="small" style="color:var(--info)">${c.submitted} to review</span>`);
    return `<button class="deal-row" data-act="open" data-id="${d.id}">
      <div style="min-width:0"><div class="row" style="gap:8px"><span class="addr">${esc(d.address)}</span>${d.linked ? '<span class="tag dual">Dual agency</span>' : ""}</div>
        <div class="small muted">${esc(d.city)} · ${TYPE_LABEL[d.type]}${opts.showAgent ? " · " + esc(agentName(d)) : ""}</div></div>
      <div>${pill(s, tone)}</div>
      <div><div class="bar ${p.complete ? "done" : ""}"><span style="width:${p.total ? Math.round(p.done / p.total * 100) : 0}%"></span></div>
        <div class="small muted num" style="margin-top:4px">${p.done} of ${p.total} approved</div></div>
      <div class="row" style="gap:10px;justify-content:flex-end">${flags.join("")}</div>
    </button>`;
  }).join("") + `</div>`;
}

function renderAgentHome() {
  const list = visibleDeals();
  const isAsst = S.role === "assistant";
  let toFix = 0, missing = 0, crfNeeded = 0, waiting = 0;
  list.forEach(d => { const c = counts(d); toFix += c.rejected; missing += c.missing; waiting += c.submitted; if (stage(d)[0].startsWith("CRF needed") || stage(d)[0].startsWith("CRF returned")) crfNeeded++; });
  const active = list.filter(d => stage(d)[0] !== "Paid");
  const done = list.filter(d => stage(d)[0] === "Paid");
  return `<div class="stack">
    <div class="row between">
      <div><h1>${isAsst ? "Deals I support" : "My deals"}</h1>
      <p class="muted">${isAsst ? "You have standing access to every deal for Jamie Alvarez and Morgan Reyes." : "Everything you have open, and what each deal still needs."}</p></div>
      <div class="row">
        ${isAsst ? "" : `<button class="btn" data-act="team">My team</button>`}
        <button class="btn" data-act="reminder">Preview reminder email</button>
        <button class="btn primary" data-act="new">New deal</button>
      </div>
    </div>
    <div class="attn">
      <div class="cell ${toFix ? "hot" : ""}"><div class="label">Returned to fix</div><div class="big num">${toFix}</div><div class="small muted">Documents your TC sent back</div></div>
      <div class="cell"><div class="label">Still missing</div><div class="big num">${missing}</div><div class="small muted">Across ${active.length} open deals</div></div>
      <div class="cell"><div class="label">Waiting on TC</div><div class="big num">${waiting}</div><div class="small muted">Submitted, not yet reviewed</div></div>
      <div class="cell ${crfNeeded ? "hot" : ""}"><div class="label">Commission forms due</div><div class="big num">${crfNeeded}</div><div class="small muted">Title funds received</div></div>
    </div>
    <div class="panel"><div class="panel-h"><h3>Open deals</h3><span class="small muted">Tap a deal to see its checklist</span></div>${dealRows(active, { showAgent: isAsst })}</div>
    ${done.length ? `<div class="panel"><div class="panel-h"><h3>Paid</h3></div>${dealRows(done, { showAgent: isAsst })}</div>` : ""}
  </div>`;
}

function renderDeal(d) {
  const p = progress(d), [s, tone] = stage(d);
  const role = S.role, isAgentSide = role === "agent" || role === "assistant", isTc = role === "tc";
  const linked = d.linked ? deal(d.linked) : null;
  const facts = [
    ["Agent", agentName(d) + (d.coAgents.length ? " · co-agent " + d.coAgents.join(", ") : "")],
    ["TC", TCS[PEOPLE[d.agent].tc]],
    ["Office", PEOPLE[d.agent].office],
    ["Type", d.propType + (d.yearBuilt ? ", built " + d.yearBuilt : "")],
    [d.type === "listing" ? "List price" : "Contract price", money(d.price)],
    ["dash #", d.dash || "Not entered yet"],
    ["MLS #", d.mls || "—"]
  ];
  if (d.type !== "listing") facts.push(["Closing", fmtDate(d.closingDate)], ["Title company", d.titleCo || "—"]);

  const items = itemsOf(d).map(({ def, s: it }) => {
    const [lab, t] = ST_PILL[it.status];
    let acts = "";
    if (isAgentSide && ["missing", "rejected"].includes(it.status)) {
      acts += def.prefill ? `<button class="btn sm primary" data-act="prefill" data-id="${d.id}" data-key="${def.key}">Review and submit</button><button class="btn sm" data-act="upload" data-id="${d.id}" data-key="${def.key}">Upload PDF</button>`
                          : `<button class="btn sm primary" data-act="upload" data-id="${d.id}" data-key="${def.key}">${it.status === "rejected" ? "Upload corrected PDF" : "Upload PDF"}</button>`;
      if (def.optional && it.status === "missing") acts += `<button class="btn sm" data-act="nareq" data-id="${d.id}" data-key="${def.key}">Doesn't apply</button>`;
    }
    if (isAgentSide && it.status === "submitted") acts += `<button class="btn sm" data-act="upload" data-id="${d.id}" data-key="${def.key}">Replace</button>`;
    if (isTc && it.status === "submitted") acts += `<button class="btn sm ok" data-act="approve" data-id="${d.id}" data-key="${def.key}">Approve</button><button class="btn sm danger" data-act="reject" data-id="${d.id}" data-key="${def.key}">Return to agent</button>`;
    if (isTc && it.status === "na-req") acts += `<button class="btn sm ok" data-act="approve-na" data-id="${d.id}" data-key="${def.key}">Agree, not needed</button><button class="btn sm danger" data-act="reject" data-id="${d.id}" data-key="${def.key}">It's needed</button>`;
    const fileLine = it.file && !["missing", "auto-na", "na", "na-req"].includes(it.status)
      ? `<div class="file">📄 ${esc(it.file)}${it.date ? " · " + fmtDate(it.date) : ""}${it.sharedFrom ? " · also filed to the linked deal" : ""}</div>` : "";
    const note = it.status === "rejected" && it.note ? `<div class="note"><b>Petrina:</b> ${esc(it.note)}</div>`
      : it.status === "na-req" && it.note ? `<div class="note info">${esc(it.note)}</div>` : "";
    const hint = it.status === "auto-na" ? def.na : def.hint || "";
    return `<div class="item ${["auto-na", "na"].includes(it.status) ? "na" : ""}">
      <div style="min-width:0"><div class="row" style="gap:8px"><span class="name">${esc(def.name)}</span>${pill(lab, t)}${def.optional && it.status !== "auto-na" ? '<span class="tag">If applicable</span>' : ""}${linked && def.shared ? '<span class="tag dual">Files to both sides</span>' : ""}</div>
        ${hint ? `<div class="hint">${esc(hint)}</div>` : ""}${fileLine}${note}</div>
      <div class="acts">${acts}</div></div>`;
  }).join("");

  // Side panels
  let side = "";
  if (d.type === "listing") {
    side += `<div class="panel"><div class="panel-h"><h3>Office tasks</h3><span class="small muted">Done by the front desk</span></div><div class="panel-b">
      ${p.complete ? "" : `<p class="small muted" style="margin-bottom:10px">These start once every listing document is approved.</p>`}
      <div class="checks">${OFFICE_TASKS.map((t, i) => `<label><input type="checkbox" data-act="task" data-id="${d.id}" data-i="${i}" ${d.tasks && d.tasks[i] ? "checked" : ""} ${role === "frontdesk" && p.complete ? "" : "disabled"}> ${esc(t)}</label>`).join("")}</div>
      ${isAgentSide && p.complete ? `<div style="margin-top:14px"><button class="btn sm" data-act="amend" data-id="${d.id}">Amend or extend this listing</button></div>` : ""}
    </div></div>`;
  } else {
    const c = d.crf;
    const steps = [
      ["All documents approved", p.complete],
      ["Title advice received", !!d.advice],
      ["CRF submitted by agent", c && ["submitted", "tc", "acct", "paid"].includes(c.status)],
      ["CRF approved by TC", c && ["tc", "acct", "paid"].includes(c.status)],
      ["CRF approved by accounting", c && ["acct", "paid"].includes(c.status)],
      ["Commission paid", c && c.status === "paid"]
    ];
    const nowIdx = steps.findIndex(x => !x[1]);
    let action = "";
    if (isAgentSide && d.advice && (!c || c.status === "draft" || c.status === "returned")) action = `<button class="btn primary" data-act="crf" data-id="${d.id}">Fill out commission request</button>`;
    else if (isAgentSide && !p.complete) action = `<p class="small muted">The commission request opens once the file is complete and the title advice is in. No complete file, no commission.</p>`;
    if (isTc && p.complete && !d.advice) action = `<button class="btn primary" data-act="advice" data-id="${d.id}">Upload title advice</button>`;
    if (isTc && c && c.status === "submitted") action = `<button class="btn primary" data-act="crf-review" data-id="${d.id}">Review CRF</button>`;
    if (role === "accounting" && c && c.status === "tc") action = `<button class="btn primary" data-act="crf-review" data-id="${d.id}">Review CRF</button>`;
    if (role === "accounting" && c && c.status === "acct") action = `<button class="btn ok" data-act="paid" data-id="${d.id}">Mark commission paid</button>`;
    if (c && c.status !== "draft" && !action.includes("crf-review")) action += `<div style="margin-top:8px"><button class="linkbtn small" data-act="crf-view" data-id="${d.id}">View CRF</button></div>`;

function activityFeed(list, limit) {
  const all = [];
  list.forEach(d => (d.log || []).forEach((l, i) => all.push({ d: d, when: l[0], text: l[1], order: i })));
  const ts = w => new Date(w + (/\d{4}/.test(w) ? "" : ", 2026")).getTime() || 0;
  all.sort((a, b) => ts(b.when) - ts(a.when) || b.order - a.order);
  const rows = all.slice(0, limit || 60);
  return rows.length ? `<div class="tablewrap"><table><thead><tr><th>When</th><th>Deal</th><th>What changed</th></tr></thead><tbody>` + rows.map(x => `<tr class="click" data-act="open" data-id="${x.d.id}"><td class="num muted" style="white-space:nowrap">${esc(x.when)}</td><td><b>${esc(x.d.address)}</b><div class="small muted">${TYPE_LABEL[x.d.type]} · ${esc(agentName(x.d))}</div></td><td>${esc(x.text)}</td></tr>`).join("") + `</tbody></table></div>` : `<div class="empty">No activity yet.</div>`;
}

    <div class="modal-h"><div><h2 id="m-title">${esc(title)}</h2>${sub ? `<p class="small muted">${sub}</p>` : ""}</div><button class="x" data-act="close" aria-label="Close">×</button></div>
    <div class="modal-b">${body}</div>${foot ? `<div class="modal-f">${foot}</div>` : ""}</div></div>`;
  const f = $("#modal-root input:not([type=radio]):not([type=hidden]), #modal-root textarea, #modal-root select"); if (f) f.focus();
}
function closeModal() { $("#modal-root").innerHTML = ""; }
const fld = (id, label, val, opts) => {
  opts = opts || {};
  const pre = opts.pre ? `<span class="pre">Filled in from this deal</span>` : "";
  if (opts.select) return `<div class="field ${opts.full ? "full" : ""}"><label for="${id}">${label}</label><select id="${id}">${opts.select.map(o => `<option ${o === val ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>${pre}</div>`;
  if (opts.area) return `<div class="field full"><label for="${id}">${label}</label><textarea id="${id}" placeholder="${esc(opts.ph || "")}">${esc(val)}</textarea>${pre}</div>`;
  return `<div class="field ${opts.full ? "full" : ""}"><label for="${id}">${label}</label><input id="${id}" type="${opts.type || "text"}" value="${esc(val)}" placeholder="${esc(opts.ph || "")}" ${opts.ro ? "readonly" : ""} ${opts.step ? `step="${opts.step}"` : ""}>${pre}</div>`;
};
const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };

function syncNewDeal() {

function createDeal() {
  const t = (document.querySelector("input[name=dtype]:checked") || {}).value;
  const address = val("nd-address");
  if (!address) { const e = $("#nd-err"); e.hidden = false; e.textContent = "Add the property address to create the deal."; return; }
  const base = { agent: S.role === "assistant" ? "jamie" : "jamie", address: address, city: val("nd-city"), propType: val("nd-type"), yearBuilt: val("nd-year"), price: +val("nd-price") || null, sellers: val("nd-sellers") || "—", buyers: val("nd-buyers") || "—", mls: val("nd-mls"), dash: "", coAgents: val("nd-co") ? [val("nd-co")] : [], titleCo: val("nd-title"), closingDate: val("nd-close"), contractDate: TODAY, opened: TODAY, items: {}, extra: [], tasks: {} };
  const who = actor();
  let created;
  if (t === "dual") {
    const a = Object.assign({}, base, { id: S.nextId++, type: "seller", log: [] }), b = Object.assign({}, base, { id: S.nextId++, type: "buyer", inHouse: true, items: {}, extra: [], log: [] });
    a.linked = b.id; b.linked = a.id; a.items = {};
    addLog(a, `${who} opened a dual agency deal (linked to the buyer side)`); addLog(b, `${who} opened a dual agency deal (linked to the seller side)`);
    S.deals.unshift(a, b); created = a;
  } else {
    created = Object.assign({}, base, { id: S.nextId++, type: t, inHouse: val("nd-inhouse") === "yes", log: [] });
    addLog(created, `${who} opened the deal`);
    S.deals.unshift(created);
  }
  closeModal(); save();
  toast(t === "dual" ? "Two linked deals created. The front desk and Petrina have been notified." : "Deal created. The front desk and Petrina have been notified.");
  go({ name: "deal", id: created.id });
}

    <div class="fgrid">${rows.map((r, i) => fld("pf" + i, r[0], r[1], { pre: true, ro: true })).join("")}
    ${extra.map((r, i) => fld("pfx" + i, r[0], r[1], { full: true, area: /title|Highlights|description|remarks|instructions|Features/i.test(r[0]), ph: "In the real app, the rest of the form's fields go here" })).join("")}</div>`;
  modal(def.name, esc(d.address) + " · " + esc(d.city), body, `<button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="prefill-submit" data-id="${d.id}" data-key="${key}">Submit to Petrina</button>`, true);
}

function rejectModal(d, key) {
  const def = defsFor(d).find(x => x.key === key);
  modal("Return to agent", esc(def.name) + " · " + esc(d.address),
    `<div class="field"><label for="rj-note">What needs to change? The agent sees this note and it goes in their next reminder.</label><textarea id="rj-note" placeholder="e.g. Seller signature missing on page 3"></textarea></div><p class="err" id="rj-err" hidden>Add a note so ${esc(agentName(d).split(" ")[0])} knows what to fix.</p>`,
    `<button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="reject-send" data-id="${d.id}" data-key="${key}">Return to agent</button>`);
}

function crfFields(d, c, ro) {
  const pre = { pre: !ro, ro: true };
  return `<div class="fgrid">
    ${fld("c-mls", "MLS #", d.mls, pre)}${fld("c-dash", "dash transaction #", d.dash, pre)}
    ${fld("c-addr", "Property address", d.address + ", " + d.city, Object.assign({ full: true }, pre))}
    ${fld("c-sell", "Seller's legal name", d.sellers, pre)}${fld("c-buy", "Buyer's legal name", d.buyers, pre)}
    ${fld("c-close", "Closing date", fmtDate(d.closingDate), pre)}${fld("c-title", "Title company", d.titleCo, pre)}
    ${fld("c-lp", "Listing price", money(d.listPrice || d.price), pre)}${fld("c-sp", "Sold price", money(d.sold || d.price), pre)}
    ${fld("c-lb", d.type === "buyer" ? "Selling broker(s)" : "Listing broker(s)", agentName(d) + (d.coAgents.length ? " / " + d.coAgents.join(", ") : ""), Object.assign({ full: true }, pre))}
    ${fld("c-gross", "Broker gross compensation received", c.gross, { type: "number", ro: true, pre: !ro })}
    ${fld("c-adj", "Compensation adjustment amount (if any)", c.adj, { type: "number", ro: ro })}
    ${ro ? fld("c-adjwhy", "Explain adjustment", c.adjWhy || "—", { full: true, ro: true }) : fld("c-adjwhy", "Explain adjustment", c.adjWhy, { area: true, ph: "Only if the compensation was reduced or split" })}
    ${fld("c-arn", "ASSIR referral: broker name", c.assirRefName, { ro: ro })}${fld("c-ar", "ASSIR referral amount", c.assirRef || "", { type: "number", ro: ro, step: "0.01" })}
    ${fld("c-orn", "Outside referral: person's name", c.outRefName, { ro: ro })}${fld("c-or", "Outside referral amount", c.outRef || "", { type: "number", ro: ro, step: "0.01" })}
    ${fld("c-pay", "Make agent compensation payable to", c.payTo, { full: true, ro: ro, ph: "Company or individual, exactly as the check or wire should read" })}
    ${fld("c-split", "Agent split (from your agent profile)", Math.round(c.split * 100) + "%", { ro: true, pre: !ro })}
  </div>
  <div class="panel"><div class="panel-b"><div class="calc num" id="crf-calc"></div></div></div>`;
}
function crfCalcHtml(c) {
  const k = crfCalc(c);
  return `<span>Broker gross compensation</span><span>${money(k.gross)}</span>
    <span>Less referrals</span><span>${money(-(k.gross - k.lessRef))}</span>
    <span>Gross less referrals</span><span>${money(k.lessRef)}</span>
    <span>Sotheby's / admin (5%)</span><span>${money(-k.admin)}</span>
    <span>Gross less Sotheby's</span><span>${money(k.afterAdmin)}</span>
    <span class="tot">Net to agent (${Math.round(c.split * 100)}% split)</span><span class="tot">${money(k.net)}</span>
    <span>ASSIR compensation</span><span>${money(k.assir)}</span>`;
}
function readCrf(c) {
  return Object.assign({}, c, { adj: val("c-adj"), adjWhy: val("c-adjwhy"), assirRefName: val("c-arn"), assirRef: +val("c-ar") || 0, outRefName: val("c-orn"), outRef: +val("c-or") || 0, payTo: val("c-pay") });
}
function crfModal(d) {
  const c = d.crf && d.crf.status !== "paid" ? d.crf : { status: "draft", gross: d.advice.amount, adj: "", adjWhy: "", assirRefName: "", assirRef: 0, outRefName: "", outRef: 0, payTo: agentName(d), split: PEOPLE[d.agent].split };
  modal("Commission Request Form", "Compensation Request Form – Sales · " + esc(d.address),
    `<div class="callout">Most of this is filled in from the deal and the title advice. Add any referrals and who to pay. The math updates as you type. Submitting here counts as your approval of the CRF.</div>` + crfFields(d, c, false) +
    `<p class="small muted">If there's a referral or a compensation reduction, upload the signed agreement to the deal too.</p><p class="err" id="crf-err" hidden></p>`,
    `<button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="crf-submit" data-id="${d.id}">Submit to Petrina</button>`, true);
  $("#crf-calc").innerHTML = crfCalcHtml(c);
  crfDraftBase = c;
}
let crfDraftBase = null;
document.addEventListener("input", () => { const el = $("#crf-calc"), pay = $("#c-pay"); if (el && pay && !pay.readOnly && crfDraftBase) el.innerHTML = crfCalcHtml(readCrf(crfDraftBase)); });
function crfReadModal(d, mode) {
  const c = d.crf;
  let foot = `<button class="btn" data-act="close">Close</button>`;
  if (mode === "tc") foot = `<button class="btn danger" data-act="crf-return" data-id="${d.id}">Return to agent</button><button class="btn ok" data-act="crf-tc-ok" data-id="${d.id}">Approve and send to accounting</button>`;
  if (mode === "acct") foot = `<button class="btn" data-act="close">Cancel</button><button class="btn ok" data-act="crf-acct-ok" data-id="${d.id}">Approve CRF</button>`;
  const hist = [["Submitted by agent", c.submitted], ["Approved by TC", c.tcApproved], ["Approved by accounting", c.acctApproved], ["Paid", c.paid]].filter(x => x[1]).map(x => `${x[0]} ${fmtDate(x[1])}`).join(" · ");
  modal("Commission Request Form", esc(d.address) + " · " + esc(agentName(d)) + (hist ? "<br>" + esc(hist) : ""),
    crfFields(d, c, true) + (mode === "tc" ? `<div class="field"><label for="crf-note">Note to agent (only if returning)</label><textarea id="crf-note"></textarea></div><p class="err" id="crf-err" hidden></p>` : ""), foot, true);
  $("#crf-calc").innerHTML = crfCalcHtml(c);
}
function adviceModal(d) {
  modal("Upload title advice", esc(d.address) + " · " + esc(agentName(d)),
    `<div class="fgrid">${fld("adv-amt", "Amount received", "", { type: "number", step: "0.01", ph: "From the wire advice" })}${fld("adv-date", "Date received", TODAY, { type: "date" })}
    <div class="field full"><label for="adv-file">Advice PDF</label><input id="adv-file" type="file" accept="application/pdf,.pdf"></div></div>
    <p class="small muted">${esc(agentName(d).split(" ")[0])} gets an email and an app notice to fill out their commission request. The advice is filed to the deal's Dropbox folder.</p><p class="err" id="adv-err" hidden>Enter the amount from the advice.</p>`,
    `<button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="advice-save" data-id="${d.id}">Save and notify agent</button>`);
}
function teamModal() {
  const list = S.team.jamie || [];
  modal("My team", "People you add here can see and work on all of your deals, including opening new ones. Co-agents are different: add them on each deal.",
    `<div class="panel"><div class="items">${list.length ? list.map(n => `<div class="item"><div><span class="name">${esc(n)}</span><div class="hint">Assistant · all deals</div></div><div class="acts"><button class="btn sm danger" data-act="team-remove" data-name="${esc(n)}">Remove</button></div></div>`).join("") : `<div class="empty">No one yet.</div>`}</div></div>
    <div class="row" style="align-items:flex-end"><div class="field" style="flex:1;min-width:200px"><label for="tm-email">Add an assistant by company email</label><input id="tm-email" placeholder="name@aspensnowmasssir.com"></div><button class="btn primary" data-act="team-add">Add</button></div>
    <p class="err" id="tm-err" hidden>Use an @aspensnowmasssir.com email address.</p>`, `<button class="btn" data-act="close">Done</button>`);
}
function reminderModal() {
  const list = visibleDeals().filter(d => stage(d)[0] !== "Paid");
  const lines = [];
  list.forEach(d => {
    const bad = itemsOf(d).filter(x => x.s.status === "rejected"), miss = itemsOf(d).filter(x => x.s.status === "missing");
    const crf = stage(d)[0].startsWith("CRF needed");
    if (!bad.length && !miss.length && !crf) return;
    lines.push(`${d.address}, ${d.city} (${TYPE_LABEL[d.type]})`);
    bad.forEach(x => lines.push(`   • FIX: ${x.def.name}: "${x.s.note}"`));
    miss.forEach(x => lines.push(`   • Missing: ${x.def.name}`));
    if (crf) lines.push(`   • Title funds are in. Fill out your commission request.`);
    lines.push("");
  });
  modal("Reminder email preview", "Sent every other day while something is missing. Next one: Wednesday, Nov 18.",
    `<div class="email"><div class="eh"><span><b>To:</b> Jamie Alvarez</span><span><b>From:</b> ASSIR Deal Desk</span><span><b>Subject:</b> ${lines.length ? "Your deals: documents still needed" : "You're all caught up"}</span></div>
    <div class="eb">Hi Jamie,\n\nHere's what your deals still need. Tap a deal in the app to upload.\n\n${esc(lines.join("\n")) || "Nothing outstanding."}\nPetrina</div></div>`, `<button class="btn" data-act="close">Close</button>`, true);
}
function emailModal(d) {
  const k = crfCalc(d.crf);
  modal("Email sent to accounting", "This is what accounting receives when a TC approves a CRF.",
    `<div class="email"><div class="eh"><span><b>To:</b> accounting@aspensnowmasssir.com</span><span><b>Subject:</b> CRF ready: ${esc(d.address)}, ${esc(d.city)}</span><span><b>Attached:</b> CRF – ${esc(d.address)}.pdf</span></div>
    <div class="eb">The file for ${esc(d.address)} is complete and Petrina approved the commission request.\n\nAgent: ${esc(agentName(d))}\nPay to: ${esc(d.crf.payTo)}\nNet to agent: ${money(k.net)}\nASSIR compensation: ${money(k.assir)}\n\nReview and approve it in Deal Desk.</div></div>`,
    `<button class="btn primary" data-act="close">OK</button>`, true);
}

// ---------- Actions ----------
let pendingUpload = null;
function setItem(d, key, data, fromLinked) {
  d.items[key] = Object.assign({}, d.items[key], data);
  const def = defsFor(d).find(x => x.key === key);
  if (!fromLinked && d.linked && def && def.shared) {
    const o = deal(d.linked);
    if (o && !(o.items[key] && o.items[key].status === "approved")) { o.items[key] = Object.assign({}, data, { sharedFrom: d.id }); addLog(o, `${data.status === "submitted" ? "Uploaded" : "Updated"} ${def.name} (shared from the ${TYPE_LABEL[d.type].toLowerCase()} deal)`); }
    d.items[key].sharedFrom = o ? o.id : null;
  }
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const act = t.dataset.act, d = t.dataset.id ? deal(t.dataset.id) : null, key = t.dataset.key;
  if (act === "scrim" && e.target !== t) return;
  switch (act) {
    case "role": S.role = t.dataset.role; save(); render(); break;
    case "reset": S = seed(); save(); render(); toast("Example data reset."); break;
    case "home": go({ name: "home", tab: view().tab, office: view().office }); break;
    case "open": go({ name: "deal", id: +t.dataset.id, tab: view().tab, office: view().office }); break;
    case "tab": go({ name: "home", tab: t.dataset.tab }); break;
    case "close": case "scrim": closeModal(); break;
    case "new": newDealModal(); break;
    case "create": createDeal(); break;
    case "team": teamModal(); break;
    case "team-add": { const v = val("tm-email").toLowerCase(); if (!/^[^@\s]+@aspensnowmasssir\.com$/.test(v)) { $("#tm-err").hidden = false; return; }
      const nm = v.split("@")[0].replace(/[._]/g, " ").replace(/\b\w/g, c => c.toUpperCase()); S.team.jamie = (S.team.jamie || []).concat(nm); save(); teamModal(); toast(nm + " now has access to all your deals."); break; }
    case "team-remove": S.team.jamie = (S.team.jamie || []).filter(n => n !== t.dataset.name); save(); teamModal(); render(); break;
    case "reminder": reminderModal(); break;
    case "upload": pendingUpload = { id: d.id, key: key }; $("#file-picker").value = ""; $("#file-picker").click(); break;
    case "prefill": prefillModal(d, key); break;
    case "prefill-submit": { const def = defsFor(d).find(x => x.key === key); setItem(d, key, { status: "submitted", file: def.name + " (generated).pdf", date: TODAY, note: "" }); addLog(d, `${actor()} submitted the ${def.name}`); closeModal(); save(); render(); toast("Submitted. The PDF was filed to Dropbox and Petrina was notified."); break; }
    case "nareq": { const def = defsFor(d).find(x => x.key === key); setItem(d, key, { status: "na-req", note: `${actor()}: this doesn't apply to this deal.`, date: TODAY }); addLog(d, `${actor()} said ${def.name} doesn't apply`); save(); render(); toast("Sent to Petrina to confirm."); break; }
    case "approve": { const def = defsFor(d).find(x => x.key === key); setItem(d, key, { status: "approved", note: "" }); addLog(d, `Petrina approved the ${def.name}`); save(); render();
      toast(progress(d).complete ? (d.type === "listing" ? "Approved. Every listing document is in: ready for MLS." : "Approved. The file is complete.") : "Approved."); break; }
    case "approve-na": { const def = defsFor(d).find(x => x.key === key); setItem(d, key, { status: "na", note: "" }); addLog(d, `Petrina agreed ${def.name} isn't needed`); save(); render(); toast("Marked not applicable."); break; }
    case "reject": rejectModal(d, key); break;
    case "reject-send": { const note = val("rj-note"); if (!note) { $("#rj-err").hidden = false; return; } const def = defsFor(d).find(x => x.key === key);
      setItem(d, key, { status: d.items[key] && d.items[key].status === "na-req" ? "missing" : "rejected", note: note }); if (d.items[key].status === "missing") d.items[key].note = "";
      addLog(d, `Petrina returned the ${def.name}: ${note}`); closeModal(); save(); render(); toast(agentName(d).split(" ")[0] + " was emailed with your note."); break; }
    case "dash": { const v = val("dash-" + d.id); if (!v) { toast("Type the dash transaction number first."); return; } d.dash = v; addLog(d, `${actor()} entered it in dash (#${v})`); save(); render(); toast("Saved. The deal is out of the dash queue."); break; }
    case "amend": d.extra.push({ key: "amend" + (d.extra.length + 1), name: "Listing Amendment/Extension" + (d.extra.length ? " #" + (d.extra.length + 1) : ""), hint: "Signed amendment or extension. The office tasks will be redone for the change." });
      OFFICE_TASKS.forEach((_, i) => { if (i !== 7) d.tasks[i] = false; }); addLog(d, `${actor()} started a listing change`); save(); render(); toast("Change started. Upload the signed amendment or extension."); break;
    case "advice": adviceModal(d); break;
    case "advice-save": { const amt = +val("adv-amt"); if (!amt) { $("#adv-err").hidden = false; return; } const f = $("#adv-file").files[0];
      d.advice = { amount: amt, date: val("adv-date") || TODAY, file: f ? f.name : "Title advice.pdf" }; addLog(d, `Petrina uploaded the title advice (${money(amt)})`); closeModal(); save(); render(); toast(agentName(d).split(" ")[0] + " was told to submit their commission request."); break; }
    case "crf": crfModal(d); break;
    case "crf-submit": { const base = d.crf && d.crf.status !== "paid" ? d.crf : { gross: d.advice.amount, split: PEOPLE[d.agent].split }; const c = readCrf(base);
      if (!c.payTo) { const e2 = $("#crf-err"); e2.hidden = false; e2.textContent = "Say who the compensation should be paid to."; return; }
      if ((c.assirRef && !c.assirRefName) || (c.outRef && !c.outRefName)) { const e2 = $("#crf-err"); e2.hidden = false; e2.textContent = "Add the name for each referral amount."; return; }
      c.status = "submitted"; c.submitted = TODAY; c.returnNote = ""; d.crf = c; addLog(d, `${actor()} submitted the commission request`); closeModal(); save(); render(); toast("Commission request sent to Petrina."); break; }
    case "crf-view": crfReadModal(d, null); break;
    case "crf-review": crfReadModal(d, S.role === "tc" ? "tc" : "acct"); break;
    case "crf-return": { const n = val("crf-note"); if (!n) { const e2 = $("#crf-err"); e2.hidden = false; e2.textContent = "Add a note so the agent knows what to change."; return; }
      d.crf.status = "returned"; d.crf.returnNote = n; addLog(d, `Petrina returned the CRF: ${n}`); closeModal(); save(); render(); toast("Returned to " + agentName(d).split(" ")[0] + "."); break; }
    case "crf-tc-ok": d.crf.status = "tc"; d.crf.tcApproved = TODAY; addLog(d, "Petrina approved the CRF and sent it to accounting"); save(); render(); emailModal(d); break;
    case "crf-acct-ok": d.crf.status = "acct"; d.crf.acctApproved = TODAY; addLog(d, "Accounting approved the CRF"); closeModal(); save(); render(); toast("CRF approved. Mark it paid once the wire goes out."); break;
    case "paid": d.crf.status = "paid"; d.crf.paid = TODAY; addLog(d, "Accounting marked the commission paid"); save(); render(); toast("Marked paid. " + agentName(d).split(" ")[0] + " was notified."); break;
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.name === "dtype") syncNewDeal();
  if (t.dataset && t.dataset.act === "task") { const d = deal(t.dataset.id); d.tasks[t.dataset.i] = t.checked; addLog(d, `${actor()} ${t.checked ? "checked" : "unchecked"} "${OFFICE_TASKS[t.dataset.i]}"`); save(); render(); }
  if (t.dataset && t.dataset.act === "office") { S.views.leadership = { name: "home", office: t.value }; save(); render(); }
  if (t.id === "file-picker" && pendingUpload) {
    const f = t.files[0]; if (!f) return;
    const d = deal(pendingUpload.id), def = defsFor(d).find(x => x.key === pendingUpload.key);
    setItem(d, pendingUpload.key, { status: "submitted", file: f.name, date: TODAY, note: "" });
    addLog(d, `${actor()} uploaded ${def.name}`);
    pendingUpload = null; save(); render();
    toast(`Sent "${f.name}" to Petrina. In the real app it's filed straight to Dropbox.`);
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

render();
})();
</script>
